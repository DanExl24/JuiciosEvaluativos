services:
  postgres:
    image: postgres:16-alpine
    container_name: juicios_jorge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-juicios}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-juicios}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: juicios_jorge_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-juicios}
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://juicios-evaluativos-jp.adsoproject.dev}
      API_URL: ${API_URL:-https://api-juicios-evaluativos-jp.adsoproject.dev}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - internal_net
      - proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-juicios-evaluativos-jp.adsoproject.dev}
    container_name: juicios_jorge_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL:-https://api-juicios-evaluativos-jp.adsoproject.dev}
    networks:
      - internal_net
      - proxy

volumes:
  pgdata:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  internal_net:
    driver: bridge
  proxy:
    external: true
